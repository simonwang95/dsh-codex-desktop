name: I004 手动原生打包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 临时制品与安装冒烟
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出构建提交
        uses: actions/checkout@v4

      - name: 配置 Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: 配置 pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 安装冻结依赖
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: 静态检查、独立性闸门与全量测试
        shell: pwsh
        run: |
          pnpm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run check:independence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 原生构建未签名 NSIS 与 ZIP
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run dist -- --win --x64

      - name: 未安装目录启动冒烟
        shell: pwsh
        run: .\scripts\smoke-package.ps1 -ApplicationPath 'release\win-unpacked\DSH Codex Desktop.exe' -BrowserEnabled

      - name: 未安装目录系统 Chrome 与会话隔离冒烟
        shell: pwsh
        run: node dist/scripts/smoke-browser-automation.mjs --workspace "$PWD" --application-path 'release\win-unpacked\DSH Codex Desktop.exe'

      - name: ZIP、NSIS 安装启动卸载与 Profile 保留冒烟
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -LiteralPath release -File -Filter 'dsh-codex-desktop-*-win-x64.exe' | Select-Object -First 1 -ExpandProperty FullName
          $zip = Get-ChildItem -LiteralPath release -File -Filter 'dsh-codex-desktop-*-win-x64.zip' | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($nsis) -or [string]::IsNullOrWhiteSpace($zip)) { throw '未找到 Windows EXE/ZIP。' }
          .\scripts\smoke-windows-artifacts.ps1 -NsisPath $nsis -ZipPath $zip -EvidencePath 'release\windows-x64-smoke.txt'

      - name: 写入构建来源证据
        shell: pwsh
        run: |
          @(
            "commit=${{ github.sha }}",
            "repository=${{ github.repository }}",
            "run_id=${{ github.run_id }}",
            "runner_os=$env:RUNNER_OS",
            "runner_arch=$env:RUNNER_ARCH",
            "node=$(node --version)",
            "pnpm=$(pnpm --version)",
            "signing=disabled",
            "publish=never",
            "artifact_retention_days=7"
          ) | Set-Content -LiteralPath 'release\windows-x64-build.txt' -Encoding UTF8

      - name: 上传 7 天临时 artifact
        uses: actions/upload-artifact@v4
        with:
          name: i004-windows-x64-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/dsh-codex-desktop-*-win-x64.exe
            release/dsh-codex-desktop-*-win-x64.zip
            release/windows-x64-smoke.txt
            release/windows-x64-build.txt
